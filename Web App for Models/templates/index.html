<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plant Stem Segmentation</title>

    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

<div class="container">

    <header>
        <h1>Plant Stem Segmentation</h1>
        <p class="subtitle">
            Compare a traditional computer vision pipeline with foundation segmentation models.
        </p>
    </header>

    <section class="controls">

        <div class="upload-section">

            <label class="upload-label">
                Select Image
            </label>

            <input type="file" id="fileInput" accept="image/*">

        </div>

        <div class="model-section">

            <h3>Select Segmentation Method</h3>

            <div class="model-buttons">

                <button id="segmentBtn" onclick="selectModel('segment')">
                    Basic CV
                </button>

                <button id="samBtn" onclick="selectModel('sam')">
                    SAM
                </button>

                <button id="sam3Btn" onclick="selectModel('sam3')">
                    SAM 3
                </button>

                <button id="vggtBtn" onclick="selectModel('vggt')">
                    VGGT-Omega
                </button>

            </div>

        </div>

        <button class="run-btn" onclick="runModel()">
            Run Segmentation
        </button>

    </section>

    <section class="results">

        <div class="result-card">

            <h2>Segmentation Result</h2>

            <img id="outputImg" alt="Segmentation output">

        </div>

        <div class="result-card" id="maskCard">

            <h2>Binary Mask</h2>

            <img id="maskImg" alt="Segmentation mask">

        </div>

    </section>

</div>

<script src="/static/script.js"></script>

</body>

</html>
